name: nuestable

services:
  postgres:
    image: postgres:15-alpine
    container_name: nuestable-postgres
    environment:
      POSTGRES_USER: nuestable
      POSTGRES_PASSWORD: nuestable
      POSTGRES_DB: nuestable
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nuestable"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: nuestable-redis
    ports:
      - "6380:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: nuestable-api
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: "postgresql://nuestable:nuestable@postgres:5432/nuestable?schema=public"
      REDIS_URL: "redis://redis:6379"
      JWT_SECRET: "nuestable-demo-jwt-secret-change-in-prod-32chars!"
      JWT_REFRESH_SECRET: "nuestable-demo-refresh-secret-change-in-prod-32!"
      CORS_ORIGIN: "*"
      LOG_LEVEL: "info"
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: nuestable-web
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  pgdata:
  redisdata:
